<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Background / Glow Gradients -->
    <linearGradient id="gtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="innoxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON BADGE -->
  <g transform="translate(15, 10)">
    <!-- Hexagonal Glow Backing -->
    <polygon points="50,2 94,26 94,74 50,98 6,74 6,26" fill="url(#shieldGrad)" stroke="url(#gtGrad)" stroke-width="3" filter="url(#neonGlow)"/>
    <polygon points="50,7 89,28 89,72 50,93 11,72 11,28" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="4,3"/>
    
    <!-- Stylized Geometric "G" & "T" Interlock -->
    <!-- Letter G -->
    <path d="M 52 26 C 36 26 26 36 26 50 C 26 64 36 74 52 74 C 62 74 68 70 71 63 L 71 52 L 48 52 L 48 44 L 79 44 L 79 66 C 72 77 62 81 50 81 C 30 81 18 68 18 50 C 18 32 30 19 51 19 C 62 19 70 23 76 29 L 70 35 C 65 30 59 26 52 26 Z" 
          fill="url(#gtGrad)"/>
    
    <!-- Central T Spark Accent -->
    <path d="M 40 33 L 78 33 L 78 40 L 63 40 L 63 67 L 55 67 L 55 40 L 40 40 Z" 
          fill="#FFFFFF" opacity="0.95"/>
    <circle cx="78" cy="22" r="3" fill="#00F5FF" filter="url(#neonGlow)"/>
  </g>

  <!-- WORDMARK: GT INNOX -->
  <g transform="translate(135, 72)">
    <!-- "GT" Text -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1" fill="url(#gtGrad)">GT</text>
    
    <!-- "INNOX" Text -->
    <text x="85" y="0" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="4" fill="url(#innoxGrad)">INNOX</text>
    
    <!-- Tagline: INNOVATION STUDIO -->
    <text x="3" y="24" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="6" fill="#00F5FF" opacity="0.9">NEXT-GEN MEDIA LAB</text>
  </g>
</svg>

